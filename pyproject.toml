[project]
name = "passphrase-arcana"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "wordfreq>=3.0",
    "pyspellchecker>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "zxcvbn-python>=4.4"]

[tool.ruff]
line-length = 100
